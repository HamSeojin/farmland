<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>인근 경매·공매 · 우리 땅 소식</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="header-title">인근 경매·공매</h1>
        <p class="header-sub">강릉·동해·삼척 토지</p>
      </div>
    </div>
    <button class="unit-toggle" type="button">m²로 보기</button>
  </header>

  <main class="content">
    <div id="auction-content"></div>

    <section class="card" id="live-search">
      <h2>다른 지역 공매 검색</h2>
      <p class="muted" style="font-size:1.1rem;">보고 싶은 지역을 골라보세요. 지금 나온 공매를 바로 찾아와요.</p>
      <div style="display:grid;gap:0.7rem;margin:0.8rem 0;">
        <label style="font-size:1.15rem;font-weight:700;display:grid;gap:0.3rem;">시·도
          <select id="sel-sido" style="font-size:1.2rem;padding:0.8rem;border-radius:0.6rem;border:2px solid #ccc;width:100%;"></select>
        </label>
        <label style="font-size:1.15rem;font-weight:700;display:grid;gap:0.3rem;">시·군·구
          <select id="sel-sgg" style="font-size:1.2rem;padding:0.8rem;border-radius:0.6rem;border:2px solid #ccc;width:100%;"></select>
        </label>
      </div>
      <button class="btn" id="btn-live-search" type="button" style="width:100%;font-size:1.3rem;padding:1rem;">검색</button>
      <p id="live-status" class="muted" style="font-size:1.1rem;min-height:1.6em;"></p>
      <div id="live-results"></div>
    </section>

    <p class="note">2026년 10월 기준 · 강릉·동해·삼척 법원경매정보 + 온비드 공매정보<br>
    참고용이에요. 입찰 전에는 반드시 원문 공고를 다시 확인하세요.</p>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">첫 화면</a>
    <a href="map.html">지도에서 찾기</a>
  </nav>
</div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  "use strict";
  function jimokEasy(j) {
    if (j === "답") return "논";
    if (j === "전") return "밭";
    return j || "";
  }
  function moneyFull(manwon) {
    manwon = Math.round(Number(manwon) || 0);
    if (manwon <= 0) return "–";
    if (manwon >= 10000) {
      var eok = Math.floor(manwon / 10000);
      var rest = manwon % 10000;
      return "약 " + eok.toLocaleString("ko-KR") + "억" +
        (rest ? " " + rest.toLocaleString("ko-KR") + "만원" : "");
    }
    return "약 " + manwon.toLocaleString("ko-KR") + "만원";
  }
  function auctionCard(a) {
    var isCourt = a.type === "court";
    var title = isCourt ? "법원경매" : "온비드공매";
    var dateRow = isCourt
      ? '<div class="t-row"><span class="k">매각기일</span><span>' + (a.saleDate || "–") + "</span></div>"
      : '<div class="t-row"><span class="k">입찰기간</span><span>' + (a.bidPeriod || "–") + "</span></div>";
    var extraRow = isCourt
      ? '<div class="t-row"><span class="k">사건번호</span><span>' + (a.displayNo || a.id || "–") + "</span></div>"
      : '<div class="t-row"><span class="k">구분</span><span>' + (a.divName || "–") + "</span></div>";
    return '<div class="trade-card">'
      + '<div class="t-date">' + title + " · " + (a.addrShort || "") + "</div>"
      + '<div class="t-row"><span class="k">종류 · 면적</span><span>' + jimokEasy(a.kind)
      + ' <span class="area" data-m2="' + (a.areaM2 || 0) + '"></span></span></div>'
      + '<div class="t-row"><span class="k">감정가</span><span>' + moneyFull(a.apslManwon) + "</span></div>"
      + '<div class="t-row"><span class="k">최저가</span><span><b>' + moneyFull(a.lowManwon) + "</b></span></div>"
      + (a.nextLowManwon
          ? '<div class="t-row"><span class="k">다음 예정가</span><span>' + moneyFull(a.nextLowManwon) + " (이번에 안 팔리면)</span></div>"
          : "")
      + dateRow
      + '<div class="t-row"><span class="k">유찰횟수</span><span>' + (a.fails || 0) + "회</span></div>"
      + extraRow
      + "</div>";
  }
  function section(title, items) {
    if (!items || !items.length) {
      return '<div class="trade-group"><div class="trade-month">' + title + "</div>"
        + '<p class="muted">수집 준비 중이에요.</p></div>';
    }
    var html = '<div class="trade-group"><div class="trade-month">' + title
      + " (" + items.length + "건)</div>";
    items.forEach(function (a) { html += auctionCard(a); });
    return html + "</div>";
  }
  /* ---- 다른 지역 공매 실시간 검색 (중계 Worker 경유, 키는 서버 보관) ---- */
  var WORKER_URL = "https://farmland-relay.813nanalove.workers.dev/api/onbid";
  var PRPT_DIV_CDS = ["0007", "0005", "0010", "0002", "0008"];
  var SIDO_SGG = {
    "서울특별시": ["종로구","중구","용산구","성동구","광진구","동대문구","중랑구","성북구","강북구","도봉구","노원구","은평구","서대문구","마포구","양천구","강서구","구로구","금천구","영등포구","동작구","관악구","서초구","강남구","송파구","강동구"],
    "부산광역시": ["중구","서구","동구","영도구","부산진구","동래구","남구","북구","해운대구","사하구","금정구","강서구","연제구","수영구","사상구","기장군"],
    "대구광역시": ["중구","동구","서구","남구","북구","수성구","달서구","달성군","군위군"],
    "인천광역시": ["중구","동구","미추홀구","연수구","남동구","부평구","계양구","서구","강화군","옹진군"],
    "광주광역시": ["동구","서구","남구","북구","광산구"],
    "대전광역시": ["동구","중구","서구","유성구","대덕구"],
    "울산광역시": ["중구","남구","동구","북구","울주군"],
    "세종특별자치시": [],
    "경기도": ["수원시","용인시","고양시","화성시","성남시","부천시","남양주시","안산시","평택시","안양시","시흥시","파주시","김포시","의정부시","광주시","하남시","광명시","군포시","양주시","오산시","이천시","안성시","구리시","의왕시","포천시","양평군","여주시","동두천시","과천시","가평군","연천군"],
    "강원특별자치도": ["춘천시","원주시","강릉시","동해시","태백시","속초시","삼척시","홍천군","횡성군","영월군","평창군","정선군","철원군","화천군","양구군","인제군","고성군","양양군"],
    "충청북도": ["청주시","충주시","제천시","보은군","옥천군","영동군","증평군","진천군","괴산군","음성군","단양군"],
    "충청남도": ["천안시","공주시","보령시","아산시","서산시","논산시","계룡시","당진시","금산군","부여군","서천군","청양군","홍성군","예산군","태안군"],
    "전북특별자치도": ["전주시","군산시","익산시","정읍시","남원시","김제시","완주군","진안군","무주군","장수군","임실군","순창군","고창군","부안군"],
    "전라남도": ["목포시","여수시","순천시","나주시","광양시","담양군","곡성군","구례군","고흥군","보성군","화순군","장흥군","강진군","해남군","영암군","무안군","함평군","영광군","장성군","완도군","진도군","신안군"],
    "경상북도": ["포항시","경주시","김천시","안동시","구미시","영주시","영천시","상주시","문경시","경산시","의성군","청송군","영양군","영덕군","청도군","고령군","성주군","칠곡군","예천군","봉화군","울진군","울릉군"],
    "경상남도": ["창원시","진주시","통영시","사천시","김해시","밀양시","거제시","양산시","의령군","함안군","창녕군","고성군","남해군","하동군","산청군","함양군","거창군","합천군"],
    "제주특별자치도": ["제주시","서귀포시"]
  };

  function normV(v) { return v == null ? "" : String(v).trim(); }
  function toManwonLive(v) {
    var n = parseFloat(normV(v).replace(/,/g, ""));
    return n > 0 ? Math.round(n / 10000) : 0;
  }
  function fmtDateLive(s) {
    s = normV(s);
    if (s.length >= 8) return s.slice(0, 4) + "년 " + parseInt(s.slice(4, 6), 10) + "월 " + parseInt(s.slice(6, 8), 10) + "일";
    return "";
  }
  function fmtPeriodLive(it) {
    var b = fmtDateLive(it.cltrBidBgngDt), e = fmtDateLive(it.cltrBidEndDt);
    if (b && e) return b + " ~ " + e;
    return b || e || "";
  }
  function isLandLive(it) {
    var cat = normV(it.cltrUsgSclsCtgrNm);
    return ["전", "답", "임야"].some(function (k) { return cat.indexOf(k) >= 0; });
  }
  function normalizeLiveItem(it) {
    var addr = normV(it.onbidCltrNm) || normV(it.zadrNm) || normV(it.cltrAdr) || normV(it.cltrRadr);
    var m = addr.match(/([가-힣]+리)\b/);
    var short = [normV(it.lctnSggnm), normV(it.lctnEmdNm), m ? m[1] : ""].filter(Boolean).join(" ");
    var area = parseFloat(normV(it.landSqms).replace(/,/g, "")) ||
               parseFloat(normV(it.bldSqms).replace(/,/g, "")) || 0;
    return {
      type: "onbid",
      addr: addr,
      addrShort: short,
      kind: normV(it.cltrUsgSclsCtgrNm),
      areaM2: area,
      apslManwon: toManwonLive(it.apslEvlAmt),
      lowManwon: toManwonLive(it.lowstBidPrcIndctCont),
      bidPeriod: fmtPeriodLive(it),
      fails: parseInt(normV(it.usbdNft), 10) || 0,
      divName: normV(it.prptDivNm),
      status: normV(it.pbctStatNm),
      _end: parseInt(normV(it.cltrBidEndDt).slice(0, 8), 10) || 99999999
    };
  }
  /* 회차 중복 제거: 현재 유효 회차(입찰종료일 >= 오늘) 중 가장 이른 것 선택.
     먼 미래 회차의 낮은 가격을 현재가처럼 보여주지 않기 위함. */
  function pickLiveRounds(rawItems) {
    var now = new Date();
    var today = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    var groups = {};
    rawItems.forEach(function (it) {
      if (!isLandLive(it)) return;
      var k = normV(it.cltrMngNo) || normV(it.onbidCltrNm);
      (groups[k] = groups[k] || []).push(normalizeLiveItem(it));
    });
    var out = [];
    Object.keys(groups).forEach(function (k) {
      var rs = groups[k].sort(function (a, b) { return a._end - b._end; });
      var cur = null, i;
      for (i = 0; i < rs.length; i++) { if (rs[i]._end >= today) { cur = rs[i]; break; } }
      if (!cur) cur = rs[rs.length - 1];
      var cheaper = rs.filter(function (r) {
        return r._end > cur._end && r.lowManwon > 0 && (!cur.lowManwon || r.lowManwon < cur.lowManwon);
      });
      if (cheaper.length) {
        cheaper.sort(function (a, b) { return a.lowManwon - b.lowManwon; });
        cur.nextLowManwon = cheaper[0].lowManwon;
        cur.nextPeriod = cheaper[0].bidPeriod;
      }
      delete cur._end;
      out.push(cur);
    });
    out.sort(function (a, b) { return (a.lowManwon || 0) - (b.lowManwon || 0); });
    return out;
  }
  function extractLiveItems(payload) {
    if (payload.result && !payload.header) return []; // NODATA {result:{resultCode:"03"}}
    var header = payload.header || {};
    var rc = String(header.resultCode || "");
    if (rc === "03") return [];
    if (rc !== "00") throw { code: "api", msg: header.resultMsg };
    var items = (((payload.body || {}).items || {}).item) || [];
    return Array.isArray(items) ? items : [items];
  }
  function fillSgg(sido, sel) {
    var list = SIDO_SGG[sido] || [];
    sel.innerHTML = "";
    if (!list.length) {
      var o = document.createElement("option");
      o.value = ""; o.textContent = "전체";
      sel.appendChild(o);
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    list.forEach(function (name) {
      var o = document.createElement("option");
      o.value = name; o.textContent = name;
      sel.appendChild(o);
    });
  }
  function initLiveSearch() {
    var selSido = document.getElementById("sel-sido");
    var selSgg = document.getElementById("sel-sgg");
    var btn = document.getElementById("btn-live-search");
    var status = document.getElementById("live-status");
    var results = document.getElementById("live-results");
    if (!selSido || !btn) return;
    Object.keys(SIDO_SGG).forEach(function (name) {
      var o = document.createElement("option");
      o.value = name; o.textContent = name;
      selSido.appendChild(o);
    });
    selSido.value = "강원특별자치도";
    fillSgg("강원특별자치도", selSgg);
    selSgg.value = "강릉시";
    selSido.addEventListener("change", function () {
      fillSgg(selSido.value, selSgg);
    });
    btn.addEventListener("click", function () {
      var sido = selSido.value, sgg = selSgg.disabled ? "" : selSgg.value;
      var label = sgg ? sido + " " + sgg : sido;
      status.textContent = "찾는 중이에요. 잠시만 기다려주세요.";
      results.innerHTML = "";
      btn.disabled = true;
      var qs = "lctnSdnm=" + encodeURIComponent(sido) + "&numOfRows=1000"
        + (sgg ? "&lctnSggnm=" + encodeURIComponent(sgg) : "");
      var fetches = PRPT_DIV_CDS.map(function (cd) {
        return fetch(WORKER_URL + "?" + qs + "&prptDivCd=" + cd).then(function (r) {
          if (r.status === 503) throw { code: 503 };
          if (!r.ok) throw { code: r.status };
          return r.json();
        });
      });
      Promise.all(fetches).then(function (payloads) {
        var raw = [];
        payloads.forEach(function (p) { raw = raw.concat(extractLiveItems(p)); });
        var items = pickLiveRounds(raw);
        btn.disabled = false;
        if (!items.length) {
          status.textContent = "이 지역에는 지금 나온 공매 땅이 없어요.";
          return;
        }
        status.textContent = label + " 공매 " + items.length + "건이에요.";
        var html = "";
        items.forEach(function (a) { html += auctionCard(a); });
        results.innerHTML = html;
        if (window.FarmlandApp) window.FarmlandApp.renderAreas();
      }).catch(function (err) {
        btn.disabled = false;
        if (err && err.code === 503) {
          status.textContent = "지금은 검색할 수 없어요. 잠시 후 다시 시도해주세요.";
        } else {
          status.textContent = "인터넷 연결을 확인하고 다시 시도해주세요.";
        }
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    var el = document.getElementById("auction-content");
    var au = (typeof AUCTIONS !== "undefined") ? AUCTIONS : { court: [], onbid: [] };
    el.innerHTML = section("법원경매", au.court) + section("온비드공매", au.onbid);
    if (window.FarmlandApp) window.FarmlandApp.renderAreas();
    initLiveSearch();
  });
})();
</script>
</body>
</html>
