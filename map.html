<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>지도에서 찾기 · 우리 땅 소식</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div class="page">
  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="header-title">지도에서 찾기</h1>
        <p class="header-sub">궁금한 땅을 눌러보세요</p>
      </div>
    </div>
    <button class="unit-toggle" type="button">m²로 보기</button>
  </header>

  <div class="shortcut-bar" id="shortcut-bar">
    <button class="shortcut-btn" type="button" data-place="donghae">동해 집<br>근처</button>
    <button class="auction-toggle" type="button" id="auction-toggle">경매·공매 표시 중</button>
  </div>
  <div class="auc-legend">
    <span><span class="dot court"></span>법원경매</span>
    <span><span class="dot onbid"></span>온비드공매</span>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="zoom-btns">
      <button type="button" id="zoom-in" aria-label="확대">+</button>
      <button type="button" id="zoom-out" aria-label="축소">−</button>
    </div>
    <div class="map-hint">지도를 움직여 궁금한 땅을 눌러보세요</div>
    <div class="map-key-notice" id="key-notice" style="display:none;position:absolute;inset:2rem 1rem auto 1rem;z-index:800;">
      지도를 불러오려면 키 설정이 필요해요.<br>
      <span style="font-weight:400;font-size:1rem;">js/config.js 파일에 VWorld 키를 입력해주세요.</span>
    </div>
    <div class="map-error hidden" id="map-error">지금 연결이 안 돼요.<br>잠시 후 다시 열어보세요.</div>
    <div class="sheet hidden" id="sheet">
      <button class="sheet-close" type="button" id="sheet-close" aria-label="닫기">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html">첫 화면</a>
    <a href="map.html">지도에서 찾기</a>
  </nav>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/map.js"></script>
</body>
</html>
